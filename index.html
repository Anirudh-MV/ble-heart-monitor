<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>BLE Heart Monitor</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#444444" />
  </head>
  <body>
    <div class="connect-ui">
      <button class="connect">connect</button>
      <div class="error hide">
        ⚠️ This browser does not support the Web Bluetooth API. Please try a
        different browser
      </div>
    </div>
    <div class="ui hide">
      <audio class="audio-lower" src="audio/lower-limit-crossed.mp3"></audio>
      <audio class="audio-upper" src="audio/upper-limit-crossed.mp3"></audio>
      <audio class="audio-within" src="audio/within-range.mp3"></audio>
      <div class="heart">
        <img src="heart.png" />
        <div class="bpm">--</div>
      </div>
      <div class="controls">
        <div class="control-group">
          <label for="lower-limit">Lower limit (BPM)</label>
          <select id="lower-limit" class="lower-limit">
            <option value="">None</option>
          </select>
        </div>
        <div class="control-group">
          <label for="upper-limit">Upper limit (BPM)</label>
          <select id="upper-limit" class="upper-limit">
            <option value="">None</option>
          </select>
        </div>
        <div class="control-group">
          <label for="alert-seconds">Alert after (seconds)</label>
          <input
            id="alert-seconds"
            class="alert-seconds"
            type="number"
            min="1"
            step="1"
            placeholder="e.g. 5"
          />
        </div>
      </div>
      <div class="buttons">
        <button class="start">start</button>
        <button class="stop">stop</button>
        <button class="export-history">export old data</button>
      </div>
      <button class="export hide">export csv</button>
      <div class="modal hide">
        <div class="modal-card">
          <h3>Past sessions</h3>
          <ul class="session-list"></ul>
          <div class="modal-actions">
            <button class="modal-close">close</button>
          </div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
    <script>
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
  </body>
</html>
